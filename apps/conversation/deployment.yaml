apiVersion: apps/v1
kind: Deployment

metadata:
  name: conversation
  labels:
    app.kubernetes.io/name: conversation
    app.kubernetes.io/part-of: velony

spec:
  replicas: 3
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: conversation

  template:
    metadata:
      labels:
        app.kubernetes.io/name: conversation
        app.kubernetes.io/part-of: velony

    spec:
      imagePullSecrets:
        - name: ghcr-pull

      containers:
        - name: conversation
          image: ghcr.io/velonyapp/conversation@sha256:8ed018c8a5ecb461dfc0cacba171f02283239cac9f350cf38d4f9059a499b6fa
          imagePullPolicy: Always

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          ports:
            - name: http
              containerPort: 8001
              protocol: TCP

            - name: grpc
              containerPort: 9001
              protocol: TCP

          livenessProbe:
            grpc:
              port: 9001
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          readinessProbe:
            grpc:
              port: 9001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2

          envFrom:
            - secretRef:
                name: conversation-secret
              prefix: VELONY_CONVERSATION_

          volumeMounts:
            - name: config
              mountPath: /data/config
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: conversation-config
