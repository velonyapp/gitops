auth:
  access_token:
    secret: "${ACCESS_TOKEN_SECRET}"

transport:
  http:
    address: "0.0.0.0:8001"
    timeout: 10s

  grpc:
    address: "0.0.0.0:9001"
    timeout: 10s

  kafka:
    brokers:
      - "kafka-kafka-bootstrap:9092"
    timeout: 10s
    retry_initial_interval: 1s
    retry_max_interval: 30s
    retry_multiplier: 2.0

data:
  mysql:
    dsn: "velony_conversation_app:${MYSQL_PASSWORD}@tcp(10.0.1.119:3306)/velony_conversation"
    max_open_connections: 50
    max_idle_connections: 10
    max_connection_lifetime: 1800s

telemetry:
  tracing:
    protocol: HTTP_PROTOBUF
    endpoint: https://otlp-gateway-prod-ap-southeast-2.grafana.net/otlp/v1/traces
    authorization: "${TELEMETRY_AUTHORIZATION}"
    sample_ratio: 0.1

  metrics:
    protocol: HTTP_PROTOBUF
    endpoint: https://otlp-gateway-prod-ap-southeast-2.grafana.net/otlp/v1/metrics
    authorization: "${TELEMETRY_AUTHORIZATION}"
    export_interval: 5s
