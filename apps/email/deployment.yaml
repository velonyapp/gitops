apiVersion: apps/v1
kind: Deployment

metadata:
  name: email
  labels:
    app.kubernetes.io/name: email
    app.kubernetes.io/part-of: velony

spec:
  replicas: 2
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: email

  template:
    metadata:
      labels:
        app.kubernetes.io/name: email
        app.kubernetes.io/part-of: velony

    spec:
      imagePullSecrets:
        - name: ghcr-pull

      containers:
        - name: email
          image: ghcr.io/velonyapp/email@sha256:a9ee6387f02e771a5fbc5f291ac35cf2b3a957ad38974a44ab8d0a86e0448d3c
          imagePullPolicy: Always

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi

          ports:
            - name: http
              containerPort: 8011
              protocol: TCP

            - name: grpc
              containerPort: 9011
              protocol: TCP

          livenessProbe:
            grpc:
              port: 9011
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          readinessProbe:
            grpc:
              port: 9011
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2

          envFrom:
            - secretRef:
                name: email-secret
              prefix: VELONY_EMAIL_

          env:
            - name: VELONY_EMAIL_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username

            - name: VELONY_EMAIL_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password

          volumeMounts:
            - name: config
              mountPath: /data/config
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: email-config
