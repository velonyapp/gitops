apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: email
  labels:
    app.kubernetes.io/name: email
    app.kubernetes.io/part-of: velony

spec:
  ingressClassName: traefik

  rules:
    - host: api.velony.app
      http:
        paths:
          - path: /v1/emailTemplates
            pathType: Prefix
            backend:
              service:
                name: email
                port:
                  number: 80
          - path: /v1:sendEmail
            pathType: Exact
            backend:
              service:
                name: email
                port:
                  number: 80
