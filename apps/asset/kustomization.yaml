apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - kafka
  - rabbitmq

configMapGenerator:
  - name: asset-config
    files:
      - config.yaml

secretGenerator:
  - name: asset-secret
    envs:
      - secret.env
    options:
      disableNameSuffixHash: true
