apiVersion: rabbitmq.com/v1beta1
kind: Policy
metadata:
  name: asset.image.create.dlx
spec:
  name: asset.image.create.dlx
  pattern: "^asset\\.image\\.create$"
  applyTo: quorum_queues
  definition:
    dead-letter-exchange: app.dlx
    dead-letter-routing-key: asset.image.create.dlq
    delivery-limit: 5
    delayed-retry-type: failed
    delayed-retry-min: 1000
    delayed-retry-max: 30000
  rabbitmqClusterReference:
    name: rabbitmq
---
