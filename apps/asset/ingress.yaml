apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: asset
  labels:
    app.kubernetes.io/name: asset
    app.kubernetes.io/part-of: velony

spec:
  ingressClassName: traefik

  rules:
    - host: api.velony.app
      http:
        paths:
          - path: /v1/images
            pathType: Prefix
            backend:
              service:
                name: asset
                port:
                  number: 80
