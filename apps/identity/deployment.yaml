apiVersion: apps/v1
kind: Deployment

metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: velony

spec:
  replicas: 3
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: identity

  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: velony

    spec:
      imagePullSecrets:
        - name: ghcr-pull

      containers:
        - name: identity
          image: ghcr.io/velonyapp/identity@sha256:ea19bd080a1f93ddb9b8468faf2aeafbae5eea008af4a18c39e5cc33d66c9cb8
          imagePullPolicy: Always

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

            - name: grpc
              containerPort: 9000
              protocol: TCP

          livenessProbe:
            grpc:
              port: 9000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2

          readinessProbe:
            grpc:
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 2

          envFrom:
            - secretRef:
                name: identity-secret
              prefix: VELONY_IDENTITY_

          volumeMounts:
            - name: config
              mountPath: /data/config
              readOnly: true

      volumes:
        - name: config
          configMap:
            name: identity-config
