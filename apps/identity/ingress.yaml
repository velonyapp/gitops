apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: identity
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: velony

spec:
  ingressClassName: traefik

  rules:
    - host: api.velony.app
      http:
        paths:
          - path: /v1/users
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 80
          - path: /v1/auth
            pathType: Prefix
            backend:
              service:
                name: identity
                port:
                  number: 80
