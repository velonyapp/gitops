apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: velony-apps
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/velonyapp/gitops.git
    targetRevision: dev
    path: apps

  destination:
    server: https://kubernetes.default.svc
    namespace: velony

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
