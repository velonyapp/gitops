apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: velony

secretGenerator:
  - name: asset-secret
    envs:
      - asset.env

  - name: email-secret
    envs:
      - email.env

  - name: identity-secret
    envs:
      - identity.env

  - name: infrastructure-secret
    envs:
      - infrastructure.env

generatorOptions:
  disableNameSuffixHash: true
