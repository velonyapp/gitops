apiVersion: apps/v1
kind: Deployment
metadata:
  name: alloy
  namespace: velony
  labels:
    app.kubernetes.io/name: alloy

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app.kubernetes.io/name: alloy

  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy

    spec:
      serviceAccountName: alloy

      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473

      containers:
        - name: alloy
          image: grafana/alloy:v1.21.3
          imagePullPolicy: IfNotPresent

          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data

          env:
            - name: LOKI_TOKEN
              valueFrom:
                secretKeyRef:
                  name: infrastructure-secret
                  key: LOKI_TOKEN

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          volumeMounts:
            - name: config
              mountPath: /etc/alloy
              readOnly: true

            - name: data
              mountPath: /var/lib/alloy

      volumes:
        - name: config
          configMap:
            name: alloy-config

        - name: data
          emptyDir: {}
