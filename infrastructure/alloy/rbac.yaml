apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: velony
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-pod-logs
  namespace: velony
rules:
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch

  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-pod-logs
  namespace: velony
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: velony
roleRef:
  kind: Role
  name: alloy-pod-logs
  apiGroup: rbac.authorization.k8s.io
