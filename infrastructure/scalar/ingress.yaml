apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: scalar
  labels:
    app.kubernetes.io/name: scalar
    app.kubernetes.io/part-of: velony

spec:
  ingressClassName: traefik

  rules:
    - host: docs.velony.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scalar
                port:
                  number: 80
