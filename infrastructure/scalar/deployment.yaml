apiVersion: apps/v1
kind: Deployment

metadata:
  name: scalar
  labels:
    app.kubernetes.io/name: scalar
    app.kubernetes.io/part-of: velony

spec:
  replicas: 1
  revisionHistoryLimit: 3

  selector:
    matchLabels:
      app.kubernetes.io/name: scalar

  template:
    metadata:
      labels:
        app.kubernetes.io/name: scalar
        app.kubernetes.io/part-of: velony

    spec:
      containers:
        - name: scalar
          image: scalarapi/api-reference:0.6.17
          imagePullPolicy: Always

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          env:
            - name: API_REFERENCE_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: scalar-config
                  key: config.json
