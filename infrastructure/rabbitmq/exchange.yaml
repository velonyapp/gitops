# Main
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: app
spec:
  name: app
  type: direct
  durable: true
  autoDelete: false
  rabbitmqClusterReference:
    name: rabbitmq
---
# DLQ
apiVersion: rabbitmq.com/v1beta1
kind: Exchange
metadata:
  name: app.dlx
spec:
  name: app.dlx
  type: direct
  durable: true
  autoDelete: false
  rabbitmqClusterReference:
    name: rabbitmq
